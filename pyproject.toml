[project]
name = "supplier-reconciliation-demo"
version = "0.1.0"
description = "Synthetic holiday supplier statement reconciliation"
requires-python = ">=3.13,<3.14"
dependencies = ["google-adk[eval]>=1.0", "fastapi>=0.115", "httpx>=0.28", "uvicorn>=0.34"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
