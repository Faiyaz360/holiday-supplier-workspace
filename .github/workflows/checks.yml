name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEMO_LIVE_APPROVED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.14"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: npm ci
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m reconciliation check-evals
      - run: npm test
      - run: npm run format:check
      - name: Check hosted runtime without evaluation tools
        env:
          UV_PROJECT_ENVIRONMENT: outputs/runtime-venv
        run: |
          uv sync --locked --no-dev
          outputs/runtime-venv/bin/python -c "from reconciliation.hosted_api import create_google_app; from importlib.metadata import distributions; names = {d.metadata['Name'].lower() for d in distributions()}; assert not {'litellm', 'nltk'} & names"
